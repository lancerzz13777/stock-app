# One pass of the stock bot. cron-job.org starts this every few minutes (see README).
# The database lives in the Actions cache between runs; a run saves it again when it ends.
name: Stock bot

on:
  workflow_dispatch:
    inputs:
      export:
        description: "Only download the saved database (to move the bot to another machine)"
        type: boolean
        default: false
  schedule:
    - cron: "10 13 * * 1-5"   # 6:40 PM IST on weekdays: evening report even if cron-job.org has a problem

concurrency:                  # one run at a time, so the database never gets two writers
  group: stock-bot
  cancel-in-progress: false

permissions:
  contents: read
  actions: read   # to tell "first run" from "the cache had a hiccup"

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: pip install -q -r requirements.txt

      - name: Restore the database
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: data/market.db
          key: market-db-${{ github.run_id }}
          restore-keys: market-db-

      - name: First run - download the starting data
        if: steps.restore.outputs.cache-matched-key == ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Saved data exists but couldn't be loaded: stop, or a fresh start would overwrite your wallet
          saved=$(gh api "repos/${{ github.repository }}/actions/caches?key=market-db-&per_page=1" --jq .total_count)
          if [ "$saved" != "0" ]; then echo "::error::Saved database could not be restored"; exit 1; fi
          mkdir -p data
          curl -fsSL "https://github.com/${{ github.repository }}/releases/download/seed/market.db.gz" | gunzip > data/market.db

      - name: Export the database
        if: inputs.export
        uses: actions/upload-artifact@v4
        with:
          name: market-db
          path: data/market.db
          retention-days: 1

      - name: Run the bot once
        id: tick
        if: ${{ !inputs.export }}
        env:
          BOT_PUBLIC_LOGS: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_MPIN: ${{ secrets.ANGEL_MPIN }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
        run: python main.py tick

      # Only after the bot really ran: a failed download must never be saved as your data
      - name: Merge recent changes into the database file
        if: always() && steps.tick.outcome != 'skipped'
        run: python -c "import sqlite3; print(sqlite3.connect('data/market.db').execute('PRAGMA wal_checkpoint(TRUNCATE)').fetchone())"

      - name: Save the database
        if: always() && steps.tick.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: data/market.db
          key: market-db-${{ github.run_id }}
